name: Store Saints flyer in website files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-saints-flyer.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download the supplied promotional artwork
        env:
          HIGH_RES: 'https://media.canva.com/v2/image-resize/format:JPG/height:1536/quality:90/uri:ifs%3A%2F%2FM%2F44a68c2a-5ad8-4cd1-a452-63e860512a53/watermark:F/width:1404?csig=AAAAAAAAAAAAAAAAAAAAABwaXQk39todQuVASyHl7XcFy_wHtdCgJNfRxFxc2KKt&exp=1793865339&osig=AAAAAAAAAAAAAAAAAAAAAAs-z3yzt36NYNYADgUjG0Ct5dXmBSbNb2YHK8wfR-2W&signer=media-rpc&token=AAIAAU0AJDQ0YTY4YzJhLTVhZDgtNGNkMS1hNDUyLTYzZTg2MDUxMmE1MwAAAAABoaq00HjNmt5rwaxkuLt5Ciq1ACaEygopJKjqXv5OZ6oGUF0Ejg&x-canva-quality=thumbnail'
          THUMB: 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F44a68c2a-5ad8-4cd1-a452-63e860512a53/watermark:F/width:182?csig=AAAAAAAAAAAAAAAAAAAAABwaXQk39todQuVASyHl7XcFy_wHtdCgJNfRxFxc2KKt&exp=1793865339&osig=AAAAAAAAAAAAAAAAAAAAAAs-z3yzt36NYNYADgUjG0Ct5dXmBSbNb2YHK8wfR-2W&signer=media-rpc&token=AAIAAU0AJDQ0YTY4YzJhLTVhZDgtNGNkMS1hNDUyLTYzZTg2MDUxMmE1MwAAAAABoaq00HjNmt5rwaxkuLt5Ciq1ACaEygopJKjqXv5OZ6oGUF0Ejg&x-canva-quality=thumbnail'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          # Try the higher resolution media rendition; fall back to the provided asset rendition.
          if ! curl --fail --silent --show-error --location --retry 2 --max-time 25 "$HIGH_RES" -o assets/saints-raffle-artwork.jpg; then
            curl --fail --silent --show-error --location --retry 2 --max-time 25 "$THUMB" -o assets/saints-raffle-artwork.jpg
          fi
          file assets/saints-raffle-artwork.jpg
          test "$(wc -c < assets/saints-raffle-artwork.jpg)" -gt 3000
      - name: Preserve image in GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/saints-raffle-artwork.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add actual Saints raffle flyer image asset"
            git push
          fi
